services:
  - type: web
    name: nargiledepom-seo-panel
    env: node
    plan: starter
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
    disk:
      name: nargiledepom-data
      mountPath: /data
      sizeGB: 1
